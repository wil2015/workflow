

services:
  # =================================================================
  # AMBIENTE LEGADO (Acesse em http://localhost:5173)
  # =================================================================

  # =================================================================
  # AMBIENTE VUE (Acesse em http://localhost:5174)
  # =================================================================
  frontend_new:
    image: node:24-alpine
    container_name: front_new
    working_dir: /app
    volumes:
      - ./:/app
      - /app/node_modules
      
         
    ports:
      - "5174:5173"
    environment:
      - VITE_CLIENT_PORT=5174
      - VITE_API_URL=http://backend_new:80
    command: sh -c "npm install && npm run dev -- --host"
    depends_on:
      - backend_new

  backend_new:
    build: 
      context: .
      dockerfile: Dockerfile  # Isolamento do Servidor
    container_name: back_new
    volumes:
      # MÁGICA 3: ONDE ESTÁ A PASTA BACKEND_NOVO
      # Aqui garantimos que este container leia seus arquivos refatorados (JSON)
      - ./backend:/var/www/html/backend
      # ADICIONE ESTA LINHA ABAIXO:
      - ./public:/var/www/html/public
      - ./storage:/var/www/html/storage
      
    ports:
      - "8081:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      XDEBUG_MODE: debug,develop
      XDEBUG_CONFIG: client_host=host.docker.internal client_port=9003
    command: >
      sh -c "chmod -R 777 /var/www/html/storage && apache2-foreground"