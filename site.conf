<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    
    # Define a raiz do site na pasta segura (Public)
    DocumentRoot /var/www/html/public

    # 1. Configuração da pasta Public (Onde roda o Vue.js)
    <Directory /var/www/html/public>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # ==================================================================
    # CORREÇÃO DO ERRO 404 (Painel / API)
    # ==================================================================
    # Ensina o Apache que "/backend" está na pasta física "../backend"
    Alias /backend /var/www/html/backend

    <Directory /var/www/html/backend>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    # ==================================================================

    # ==================================================================
    # CORREÇÃO DOS PDFs (Storage)
    # ==================================================================
    # Ensina o Apache que "/storage" está na pasta física "../storage"
    Alias /storage /var/www/html/storage

    <Directory /var/www/html/storage>
        Options Indexes FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>